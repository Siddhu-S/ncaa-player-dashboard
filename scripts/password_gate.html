<div id="pw-gate" style="position:fixed;inset:0;z-index:999999;background:#0f1623;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <form id="pw-gate-form" style="background:#1a2540;border:1px solid #1e2d47;border-radius:8px;padding:32px 36px;width:280px;text-align:center;">
    <div style="color:#c8d4e8;font-size:14px;margin-bottom:16px;letter-spacing:.05em;">Enter password</div>
    <input id="pw-gate-input" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:4px;border:1px solid #2c3f61;background:#0f1623;color:#c8d4e8;font-size:14px;margin-bottom:12px;" />
    <button type="submit" style="width:100%;padding:10px;border-radius:4px;border:none;background:#c8a84b;color:#0f1623;font-weight:600;font-size:13px;cursor:pointer;">Enter</button>
    <div id="pw-gate-error" style="color:#e0637a;font-size:12px;margin-top:10px;display:none;">Incorrect password</div>
  </form>
</div>
<script>
(function () {
  // NOT real security -- this is a static site with no backend, so this
  // password (and this check) are visible to anyone who views source. It
  // only keeps casual visitors and crawlers out. Change the value below to
  // set the real password.
  var PASSWORD = "CHANGE_ME";
  var KEY = "ncaa_dashboard_unlocked";

  var gate = document.getElementById("pw-gate");
  if (sessionStorage.getItem(KEY) === "1") {
    gate.remove();
    return;
  }
  document.getElementById("pw-gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("pw-gate-input");
    if (input.value === PASSWORD) {
      sessionStorage.setItem(KEY, "1");
      gate.remove();
    } else {
      document.getElementById("pw-gate-error").style.display = "block";
      input.value = "";
      input.focus();
    }
  });
})();
</script>
