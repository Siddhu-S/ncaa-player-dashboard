name: Daily BPM and RAPM
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      recheck_season:
        description: Revalidate previously processed games
        type: boolean
        default: false
  pull_request:
    paths:
      - 'ratings/**'
      - '.github/workflows/daily-rapm.yml'
permissions:
  contents: read
concurrency:
  group: daily-ratings
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r ratings/requirements.txt
      - name: Validate both metric inputs
        if: github.event_name == 'pull_request'
        run: python ratings/daily_ratings.py --dry-run
      - name: Ingest, calculate, and publish
        if: github.event_name != 'pull_request'
        run: |
          args=()
          if [[ "$RECHECK_SEASON" == "true" ]]; then
            args+=(--recheck-season)
          fi
          python ratings/daily_ratings.py "${args[@]}"
        env:
          RATINGS_DATABASE_URL: ${{ secrets.RATINGS_DATABASE_URL }}
          RECHECK_SEASON: ${{ inputs.recheck_season }}
