name: Update recruiting rankings cache

on:
  schedule:
    - cron: "35 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-recruiting-rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - run: python scripts/update_recruiting_rankings.py --output recruiting_rankings_cache.csv --audit-output recruiting_rankings_audit.csv
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update recruiting rankings cache"
          file_pattern: recruiting_rankings_cache.csv recruiting_rankings_audit.csv
