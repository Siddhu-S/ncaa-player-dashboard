name: Update recruiting rankings cache

on:
  schedule:
    - cron: "35 6 1 10 *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      class_year:
        description: Recruiting class to refresh (defaults to the current year)
        type: string
        required: false

permissions:
  contents: write

jobs:
  update-recruiting-rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Refresh the recruiting class
        env:
          RECRUITING_CLASS_YEAR: ${{ inputs.class_year }}
        run: |
          args=()
          if [[ -n "$RECRUITING_CLASS_YEAR" ]]; then
            args+=(--years "$RECRUITING_CLASS_YEAR")
          fi
          python scripts/update_recruiting_rankings.py "${args[@]}"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update recruiting rankings cache"
          file_pattern: recruiting_rankings_cache.csv recruiting_rankings_audit.csv
